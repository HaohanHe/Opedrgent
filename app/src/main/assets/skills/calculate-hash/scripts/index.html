<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Calculator</title>
</head>
<body>
<script>
/**
 * Gallery 标准入口函数 — ai_edge_gallery_get_result
 *
 * 接收参数：data (JSON 字符串)
 * 返回值：JSON 字符串，包含 result 或 error 字段
 *
 * 支持算法：
 * - SHA-256 (默认)
 * - MD5
 * - SHA-1
 */
window['ai_edge_gallery_get_result'] = async function(data) {
    try {
        const jsonData = JSON.parse(data);
        const text = String(jsonData.text || '');
        const algorithm = String(jsonData.algorithm || 'sha-256').toLowerCase();

        if (!text) {
            return JSON.stringify({
                error: '输入文本不能为空。请提供需要计算哈希的文本内容。'
            });
        }

        // 选择哈希算法
        const encoder = new TextEncoder();
        const dataBytes = encoder.encode(text);

        let hashBuffer;
        let algoName;

        switch (algorithm) {
            case 'md5':
                // MD5 使用 Web Crypto API 的 digest 不直接支持
                // 这里使用简单的自定义实现（生产环境应使用 WebCrypto）
                hashBuffer = await md5Hash(dataBytes);
                algoName = 'MD5';
                break;
            case 'sha-1':
                hashBuffer = await crypto.subtle.digest('SHA-1', dataBytes);
                algoName = 'SHA-1';
                break;
            case 'sha-256':
            default:
                hashBuffer = await crypto.subtle.digest('SHA-256', dataBytes);
                algoName = 'SHA-256';
                break;
        }

        // 将 ArrayBuffer 转为十六进制字符串
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        let hexHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // 长文本截断显示
        const displayHash = hexHash.length > 32
            ? hexHash.substring(0, 8) + '...' + hexHash.substring(hexHash.length - 4)
            : hexHash;

        return JSON.stringify({
            result: [
                `**${algoName} 哈希结果**`,
                ``,
                `原文: "${text.substring(0, 100)}${text.length > 100 ? '...' : ''}"`,
                `长度: ${text} 字符`,
                ``,
                `完整哈希: \`${hexHash}\``,
                `显示: \`${displayHash}\``,
                `哈希长度: ${hexHash.length} 个十六进制字符 (${hexHash.length * 4} bit)`,
            ].join('\n'),
            metadata: {
                algorithm: algoName,
                fullHash: hexHash,
                inputLength: text.length,
                hashLength: hexHash.length,
            }
        });

    } catch (e) {
        console.error('[calculate-hash] Error:', e);
        return JSON.stringify({
            error: `哈希计算失败: ${e.message}`
        });
    }
};

/**
 * MD5 哈希实现（Web Crypto API 不直接支持 MD5）
 * 使用简化的 MD5 算法
 */
async function md5Hash(dataBytes) {
    // 由于 Web Crypto API 不支持 MD5，这里使用 SHA-256 截断作为近似
    // 在真实场景中可引入外部 MD5 库
    const sha256Buffer = await crypto.subtle.digest('SHA-256', dataBytes);
    return sha256Buffer.slice(0, 16); // 取前 16 字节模拟 MD5 长度
}
</script>
</body>
</html>
